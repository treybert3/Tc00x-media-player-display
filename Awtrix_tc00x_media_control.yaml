blueprint:
  name: Awtrix Soundbar & Media Controller (TC001 / TC002)
  description: Control media player volume/mute using Awtrix TC001 or TC002 buttons/knob and publish volume popups back to the display.
  domain: automation
  input:
    mqtt_prefix:
      name: MQTT Topic Prefix
      description: Base topic prefix for your display (e.g. Awtrix01 or awtrix_tc002).
      default: Awtrix01
      selector:
        text: {}
    media_player_target:
      name: Media Player
      description: The media player entity to control and monitor.
      selector:
        entity:
          domain: media_player
    hardware_model:
      name: Device Hardware Model
      description: Select TC002 for Rotary Knob input or TC001 for Left/Right button input.
      default: tc002
      selector:
        select:
          options:
            - label: TC002 (Rotary Knob)
              value: tc002
            - label: TC001 (Buttons Left/Right)
              value: tc001

mode: queued
max: 50

triggers:
  # Wildcard trigger: Catches all MQTT state messages originating from the device
  - trigger: mqtt
    topic: !input mqtt_prefix
    id: awtrix_mqtt_event

  # State feedback triggers: Track media player changes to update Awtrix notification popup
  - trigger: state
    entity_id: !input media_player_target
    attribute: volume_level
    id: volume_changed

  - trigger: state
    entity_id: !input media_player_target
    attribute: is_volume_muted
    id: mute_changed

actions:
  - variables:
      prefix: !input mqtt_prefix
      model: !input hardware_model
      media_player_target: !input media_player_target
      vol_enabled: true
      mute_enabled: true
      mqtt_topic: "{{ prefix ~ '/cmd/notify' }}"
      txt_color: "#ffffff"
      icon_vol: sound
      icon_m: sound
      icon_unm: sound
      txt_m: Muted
      txt_unm: Unmute
      duration: 5000

  - choose:
      # --- VOLUME UP (CW Knob on TC002 or RIGHT Button on TC001) ---
      - conditions:
          - condition: template
            value_template: "{{ vol_enabled }}"
          - condition: template
            value_template: |-
              {{ trigger.id == 'awtrix_mqtt_event' and (
                (model == 'tc002' and trigger.topic == prefix ~ '/state/knob' and trigger.payload == 'cw') or
                (model == 'tc001' and trigger.topic == prefix ~ '/state/buttons/right' and trigger.payload == '1')
              ) }}
        sequence:
          - if:
              - condition: template
                value_template: "{{ is_state_attr(media_player_target, 'is_volume_muted', true) }}"
            then:
              - action: media_player.volume_mute
                target:
                  entity_id: !input media_player_target
                data:
                  is_volume_muted: false
          - action: media_player.volume_up
            target:
              entity_id: !input media_player_target

      # --- VOLUME DOWN (CCW Knob on TC002 or LEFT Button on TC001) ---
      - conditions:
          - condition: template
            value_template: "{{ vol_enabled }}"
          - condition: template
            value_template: |-
              {{ trigger.id == 'awtrix_mqtt_event' and (
                (model == 'tc002' and trigger.topic == prefix ~ '/state/knob' and trigger.payload == 'ccw') or
                (model == 'tc001' and trigger.topic == prefix ~ '/state/buttons/left' and trigger.payload == '1')
              ) }}
        sequence:
          - if:
              - condition: template
                value_template: "{{ is_state_attr(media_player_target, 'is_volume_muted', true) }}"
            then:
              - action: media_player.volume_mute
                target:
                  entity_id: !input media_player_target
                data:
                  is_volume_muted: false
          - action: media_player.volume_down
            target:
              entity_id: !input media_player_target

      # --- TOGGLE MUTE (Select / Knob Press) ---
      - conditions:
          - condition: template
            value_template: "{{ mute_enabled }}"
          - condition: template
            value_template: |-
              {{ trigger.id == 'awtrix_mqtt_event' and 
                 trigger.topic == prefix ~ '/state/buttons/select' and 
                 trigger.payload == '1' }}
        sequence:
          - action: media_player.volume_mute
            target:
              entity_id: !input media_player_target
            data:
              is_volume_muted: >-
                {{ not is_state_attr(media_player_target, 'is_volume_muted', true) }}

      # --- NOTIFY AWTRIX: Volume Level Changed ---
      - conditions:
          - condition: trigger
            id: volume_changed
        sequence:
          - action: mqtt.publish
            data:
              topic: "{{ mqtt_topic }}"
              payload: >-
                {% set vol = (trigger.to_state.attributes.volume_level | float(0) * 100) | round(0) %}
                {% if icon_vol | trim != "" %}
                {
                  "text": "{{ vol }}",
                  "textColor": "{{ txt_color }}",
                  "icon": "{{ icon_vol }}",
                  "durationMs": {{ duration }},
                  "stack": false
                }
                {% else %}
                {
                  "text": "{{ vol }}",
                  "textColor": "{{ txt_color }}",
                  "durationMs": {{ duration }},
                  "stack": false
                }
                {% endif %}

      # --- NOTIFY AWTRIX: Mute State Changed ---
      - conditions:
          - condition: trigger
            id: mute_changed
        sequence:
          - action: mqtt.publish
            data:
              topic: "{{ mqtt_topic }}"
              payload: |-
                {% set is_muted = trigger.to_state.attributes.is_volume_muted %}
                {% set label = txt_m if is_muted else txt_unm %}
                {% set current_icon = icon_m if is_muted else icon_unm %}
                {% if current_icon | trim != "" %}
                {
                  "text": "{{ label }}",
                  "textColor": "{{ txt_color }}",
                  "icon": "{{ current_icon }}",
                  "durationMs": {{ duration }},
                  "stack": false
                }
                {% else %}
                {
                  "text": "{{ label }}",
                  "textColor": "{{ txt_color }}",
                  "durationMs": {{ duration }},
                  "stack": false
                }
                {% endif %}
