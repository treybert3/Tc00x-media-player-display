blueprint:
  name: Awtrix Knob & Media Player Sync
  description: Syncs MQTT volume knob and button actions from an Awtrix light display to a target media player and sends real-time volume/mute feedback notifications.
  domain: automation
  input:
    awtrix_topic:
      name: Awtrix MQTT Prefix Topic
      description: The base MQTT topic for your Awtrix display (e.g., awtrix_tc002 or awtrix).
      default: awtrix_tc002
      selector:
        text: {}
    target_media_player:
      name: Target Media Player
      description: The media player entity to control and monitor.
      selector:
        entity:
          domain: media_player
    text_color:
      name: Notification Text Color
      description: Hex color code for display text.
      default: "#ffffff"
      selector:
        color_rgb: {}
    volume_icon:
      name: Volume Icon
      description: Awtrix icon name for volume changes.
      default: sound
      selector:
        text: {}
    muted_icon:
      name: Muted Icon
      description: Awtrix icon name when muted.
      default: sound
      selector:
        text: {}
    unmuted_icon:
      name: Unmuted Icon
      description: Awtrix icon name when unmuted.
      default: sound
      selector:
        text: {}
    muted_text:
      name: Muted Text Label
      description: Text shown when player is muted.
      default: Muted
      selector:
        text: {}
    unmuted_text:
      name: Unmuted Text Label
      description: Text shown when player is unmuted.
      default: Unmuted
      selector:
        text: {}
    notification_duration:
      name: Notification Duration (ms)
      description: Duration in milliseconds for the notification to display on screen.
      default: 5000
      selector:
        number:
          min: 1000
          max: 15000
          step: 500
          unit_of_measurement: ms

mode: queued
max: 50

triggers:
  - trigger: mqtt
    topic: !input awtrix_topic
    payload: cw
    id: volume_up

  - trigger: mqtt
    topic: !input awtrix_topic
    payload: ccw
    id: volume_down

  - trigger: mqtt
    topic: !input awtrix_topic
    payload: "1"
    id: toggle_mute

  - trigger: state
    entity_id: !input target_media_player
    attribute: volume_level
    id: volume_changed

  - trigger: state
    entity_id: !input target_media_player
    attribute: is_volume_muted
    id: mute_changed

action:
  - variables:
      base_topic: !input awtrix_topic
      media_player_target: !input target_media_player
      mqtt_notify_topic: "{{ base_topic }}/cmd/notify"
      txt_color: !input text_color
      icon_vol: !input volume_icon
      icon_m: !input muted_icon
      icon_unm: !input unmuted_icon
      txt_m: !input muted_text
      txt_unm: !input unmuted_text
      duration: !input notification_duration

  - choose:
      - conditions:
          - condition: trigger
            id: volume_up
        sequence:
          - if:
              - condition: template
                value_template: "{{ is_state_attr(media_player_target, 'is_volume_muted', true) }}"
            then:
              - action: media_player.volume_mute
                target:
                  entity_id: !input target_media_player
                data:
                  is_volume_muted: false
          - action: media_player.volume_up
            target:
              entity_id: !input target_media_player

      - conditions:
          - condition: trigger
            id: volume_down
        sequence:
          - if:
              - condition: template
                value_template: "{{ is_state_attr(media_player_target, 'is_volume_muted', true) }}"
            then:
              - action: media_player.volume_mute
                target:
                  entity_id: !input target_media_player
                data:
                  is_volume_muted: false
          - action: media_player.volume_down
            target:
              entity_id: !input target_media_player

      - conditions:
          - condition: trigger
            id: toggle_mute
        sequence:
          - action: media_player.volume_mute
            target:
              entity_id: !input target_media_player
            data:
              is_volume_muted: >-
                {{ not is_state_attr(media_player_target, 'is_volume_muted', true) }}

      - conditions:
          - condition: trigger
            id: volume_changed
        sequence:
          - action: mqtt.publish
            data:
              topic: "{{ mqtt_notify_topic }}"
              payload: >-
                {% set vol = (trigger.to_state.attributes.volume_level | float(0) * 100) | round(0) %}
                {% set color_str = txt_color if txt_color is string else '#%02x%02x%02x' % (txt_color[0], txt_color[1], txt_color[2]) %}
                {% if icon_vol | trim != "" %}
                {
                  "text": "{{ vol }}",
                  "textColor": "{{ color_str }}",
                  "icon": "{{ icon_vol }}",
                  "durationMs": {{ duration }},
                  "stack": false
                }
                {% else %}
                {
                  "text": "{{ vol }}",
                  "textColor": "{{ color_str }}",
                  "durationMs": {{ duration }},
                  "stack": false
                }
                {% endif %}

      - conditions:
          - condition: trigger
            id: mute_changed
        sequence:
          - action: mqtt.publish
            data:
              topic: "{{ mqtt_notify_topic }}"
              payload: |-
                {% set is_muted = trigger.to_state.attributes.is_volume_muted %}
                {% set label = txt_m if is_muted else txt_unm %}
                {% set current_icon = icon_m if is_muted else icon_unm %}
                {% set color_str = txt_color if txt_color is string else '#%02x%02x%02x' % (txt_color[0], txt_color[1], txt_color[2]) %}
                {% if current_icon | trim != "" %}
                {
                  "text": "{{ label }}",
                  "textColor": "{{ color_str }}",
                  "icon": "{{ current_icon }}",
                  "durationMs": {{ duration }},
                  "stack": false
                }
                {% else %}
                {
                  "text": "{{ label }}",
                  "textColor": "{{ color_str }}",
                  "durationMs": {{ duration }},
                  "stack": false
                }
                {% endif %}
