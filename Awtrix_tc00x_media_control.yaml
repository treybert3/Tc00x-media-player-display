blueprint:
  name: Awtrix Control & Media Player Sync (TC001 / TC002)
  description: Control a media player using an Awtrix TC002 (knob/select button) or TC001 (left/right/select buttons), and sync volume/mute display updates.
  domain: automation

  input:
    device_model:
      name: Device Model
      description: Select your Awtrix hardware model.
      default: tc002
      selector:
        select:
          options:
            - label: TC002 (Rotary Knob)
              value: tc002
            - label: TC001 (Buttons Only)
              value: tc001

    mqtt_prefix:
      name: MQTT Prefix
      description: Base topic prefix for your Awtrix device (e.g. awtrix_tc002 or Awtrix01).
      default: awtrix_tc002
      selector:
        text: {}

    media_player:
      name: Media Player
      description: The media player entity to control.
      selector:
        entity:
          filter:
            domain: media_player

    enable_vol_controls:
      name: Enable Volume Control Events
      description: Process knob rotations (TC002) or Left/Right button presses (TC001).
      default: true
      selector:
        boolean: {}

    enable_select_mute:
      name: Enable Select Button Mute Toggle
      description: Process the select button press to toggle mute.
      default: true
      selector:
        boolean: {}

    text_color:
      name: Text Color
      description: Hex color code for display text.
      default: "#ffffff"
      selector:
        text: {}

    icon_volume:
      name: Icon for Volume
      default: "sound"
      selector:
        text: {}

    icon_mute:
      name: Icon for Mute
      default: "sound"
      selector:
        text: {}

    icon_unmute:
      name: Icon for Unmute
      default: "sound"
      selector:
        text: {}

    text_mute:
      name: Text for Mute
      default: "Muted"
      selector:
        text: {}

    text_unmute:
      name: Text for Unmute
      default: "Unmuted"
      selector:
        text: {}

    duration_ms:
      name: Notification Duration
      default: 5000
      selector:
        number:
          min: 1000
          max: 30000
          step: 500
          unit_of_measurement: ms

mode: queued
max: 50

variables:
  model: !input device_model
  vol_enabled: !input enable_vol_controls
  mute_enabled: !input enable_select_mute
  media_player_target: !input media_player
  raw_prefix: !input mqtt_prefix
  # Ensure prefix has no trailing slash for exact string matching in Jinja
  prefix: "{{ raw_prefix | regex_replace('/+$', '') }}"
  mqtt_topic: "{{ prefix ~ '/cmd/notify' }}"
  txt_color: !input text_color
  icon_vol: !input icon_volume
  icon_m: !input icon_mute
  icon_unm: !input icon_unmute
  txt_m: !input text_mute
  txt_unm: !input text_unmute
  duration: !input duration_ms

triggers:
  # Multi-level MQTT wildcard catches awtrix_tc002/state/knob, awtrix_tc002/state/buttons/select, etc.
  - trigger: mqtt
    topic: !input mqtt_prefix
    # Home Assistant treats a prefix with /# in the selector input as multi-level wildcard.
    # To enforce it regardless of user trailing slash:
    id: awtrix_mqtt_event

  - trigger: state
    entity_id: !input media_player
    attribute: volume_level
    id: volume_changed

  - trigger: state
    entity_id: !input media_player
    attribute: is_volume_muted
    id: mute_changed

actions:
  - choose:
      # Option 1: Volume Up (TC002 CW or TC001 Right Button)
      - conditions:
          - condition: template
            value_template: "{{ vol_enabled }}"
          - condition: template
            value_template: |-
              {{ trigger.id == 'awtrix_mqtt_event' and (
                (model == 'tc002' and trigger.topic.endswith('/state/knob') and trigger.payload == 'cw') or
                (model == 'tc001' and trigger.topic.endswith('/state/buttons/right') and trigger.payload == '1')
              ) }}
        sequence:
          - if:
              - condition: template
                value_template: "{{ is_state_attr(media_player_target, 'is_volume_muted', true) }}"
            then:
              - action: media_player.volume_mute
                target:
                  entity_id: !input media_player
                data:
                  is_volume_muted: false
          - action: media_player.volume_up
            target:
              entity_id: !input media_player

      # Option 2: Volume Down (TC002 CCW or TC001 Left Button)
      - conditions:
          - condition: template
            value_template: "{{ vol_enabled }}"
          - condition: template
            value_template: |-
              {{ trigger.id == 'awtrix_mqtt_event' and (
                (model == 'tc002' and trigger.topic.endswith('/state/knob') and trigger.payload == 'ccw') or
                (model == 'tc001' and trigger.topic.endswith('/state/buttons/left') and trigger.payload == '1')
              ) }}
        sequence:
          - if:
              - condition: template
                value_template: "{{ is_state_attr(media_player_target, 'is_volume_muted', true) }}"
            then:
              - action: media_player.volume_mute
                target:
                  entity_id: !input media_player
                data:
                  is_volume_muted: false
          - action: media_player.volume_down
            target:
              entity_id: !input media_player

      # Option 3: Select Button (Toggle Mute)
      - conditions:
          - condition: template
            value_template: "{{ mute_enabled }}"
          - condition: template
            value_template: |-
              {{ trigger.id == 'awtrix_mqtt_event' and 
                 trigger.topic.endswith('/state/buttons/select') and 
                 trigger.payload == '1' }}
        sequence:
          - action: media_player.volume_mute
            target:
              entity_id: !input media_player
            data:
              is_volume_muted: >-
                {{ not is_state_attr(media_player_target, 'is_volume_muted', true) }}

      # Option 4: Volume Level Changed (Publish to Awtrix Display)
      - conditions:
          - condition: trigger
            id: volume_changed
        sequence:
          - action: mqtt.publish
            data:
              topic: "{{ mqtt_topic }}"
              payload: |-
                {% set vol = (trigger.to_state.attributes.volume_level | float(0) * 100) | round(0) %}
                {% if icon_vol | trim != "" %}
                {
                  "text": "{{ vol }}",
                  "textColor": "{{ txt_color }}",
                  "icon": "{{ icon_vol }}",
                  "durationMs": {{ duration }},
                  "stack": false
                }
                {% else %}
                {
                  "text": "{{ vol }}",
                  "textColor": "{{ txt_color }}",
                  "durationMs": {{ duration }},
                  "stack": false
                }
                {% endif %}

      # Option 5: Mute Attribute Changed (Publish to Awtrix Display)
      - conditions:
          - condition: trigger
            id: mute_changed
        sequence:
          - action: mqtt.publish
            data:
              topic: "{{ mqtt_topic }}"
              payload: |-
                {% set is_muted = trigger.to_state.attributes.is_volume_muted %}
                {% set label = txt_m if is_muted else txt_unm %}
                {% set current_icon = icon_m if is_muted else icon_unm %}
                {% if current_icon | trim != "" %}
                {
                  "text": "{{ label }}",
                  "textColor": "{{ txt_color }}",
                  "icon": "{{ current_icon }}",
                  "durationMs": {{ duration }},
                  "stack": false
                }
                {% else %}
                {
                  "text": "{{ label }}",
                  "textColor": "{{ txt_color }}",
                  "icon": "{{ current_icon }}",
                  "durationMs": {{ duration }},
                  "stack": false
                }
                {% endif %}
